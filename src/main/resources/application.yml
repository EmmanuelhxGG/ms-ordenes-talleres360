server:
  port: ${SERVER_PORT:8081}

spring:
  flyway:
    enabled: false
  rabbitmq:
    addresses: ${RABBIT_ADDRESSES:localhost:5672}
    username: ${RABBIT_USERNAME:}
    password: ${RABBIT_PASSWORD:}
    virtual-host: ${RABBIT_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: ms-talleres360-orders
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  messaging:
    transport: ${MESSAGING_TRANSPORT:rabbit}
  cors:
    # Separar varios origenes con coma
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

---
# Desarrollo local: H2 en memoria
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true

---
# PostgreSQL (contenedor del compose, RDS, etc.)
spring:
  config:
    activate:
      on-profile: postgres
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration/postgresql
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders_db}
    username: ${DB_USERNAME:talleres360}
    password: ${DB_PASSWORD}
