# Ejecutar desde este repositorio: docker compose up -d --build
name: talleres360-ordenes

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: ${DB_USERNAME:?Configura DB_USERNAME en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      TZ: America/Santiago
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # PostgreSQL no publica su puerto en la EC2.

  ordenes:
    build:
      context: .
      dockerfile: Dockerfile
    image: talleres360/ms-ordenes:local
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      SPRING_PROFILES_ACTIVE: postgres
      TZ: America/Santiago
      JAVA_OPTS: "-XX:MaxRAMPercentage=60"
      DB_URL: jdbc:postgresql://postgres:5432/orders_db
      DB_USERNAME: ${DB_USERNAME:?Configura DB_USERNAME en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Configura INTERNAL_API_KEY en .env}
      CATALOG_URL: ${CATALOG_URL:?Configura la URL privada de Catalogo en .env}
      REPORT_URL: ${REPORT_URL:?Configura la URL privada de Reporteria en .env}
      NOTIFICATIONS_URL: ${NOTIFICATIONS_URL:?Configura la URL privada de Notificaciones en .env}
      AUDIT_URL: ${AUDIT_URL:?Configura la URL privada de Auditoria en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MESSAGING_TRANSPORT: ${MESSAGING_TRANSPORT:-http}
      RABBIT_ADDRESSES: ${RABBIT_ADDRESSES:-localhost:5672}
      RABBIT_USERNAME: ${RABBIT_USERNAME:-}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-}
      RABBIT_VHOST: ${RABBIT_VHOST:-/}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      KAFKA_ORDERS_TOPIC: ${KAFKA_ORDERS_TOPIC:-orders.events}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datos_postgres:
